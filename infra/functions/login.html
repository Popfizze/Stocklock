<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>StockLock</title>
<style>
:root{--bg:oklch(0.985 0 0);--card:oklch(1 0 0);--fg:oklch(0.141 0.005 285.823);--border:oklch(0.92 0.004 286.32);--primary:oklch(0.488 0.243 264.376);--primary-fg:oklch(0.97 0.014 254.604);--error:oklch(0.577 0.245 27.325);--ring:oklch(0.705 0.015 286.067)}
@media (prefers-color-scheme:dark){:root{--bg:oklch(0.141 0.005 285.823);--card:oklch(0.21 0.006 285.885);--fg:oklch(0.985 0 0);--border:oklch(1 0 0 / 15%);--primary:oklch(0.42 0.18 266);--primary-fg:oklch(0.97 0.014 254.604);--error:oklch(0.704 0.191 22.216);--ring:oklch(0.552 0.016 285.938)}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{width:100%;max-width:360px;padding:32px 24px;background:var(--card);border:1px solid var(--border);border-radius:14px}
h1{margin:0 0 24px;font-size:1.6rem;text-align:center;letter-spacing:-.01em}
label{display:block;margin-bottom:6px;font-size:.9rem;font-weight:600}
input{width:100%;padding:12px;font:inherit;color:inherit;background:transparent;border:1px solid var(--border);border-radius:10px}
input:focus{outline:2px solid var(--ring);outline-offset:1px}
button{width:100%;margin-top:16px;padding:12px;font:inherit;font-weight:600;color:var(--primary-fg);background:var(--primary);border:0;border-radius:10px;cursor:pointer}
button:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.error{margin:10px 0 0;font-size:.9rem;color:var(--error)}
</style>
</head>
<body>
<main>
<h1>StockLock</h1>
<form id="login">
<label for="password">Mot de passe</label>
<input id="password" type="password" autocomplete="current-password" autofocus required>
<!--error-->
<button type="submit">Entrer</button>
</form>
</main>
<script>
document.getElementById("login").addEventListener("submit", async function (event) {
  event.preventDefault();
  const bytes = new TextEncoder().encode(document.getElementById("password").value);
  const digest = new Uint8Array(await crypto.subtle.digest("SHA-256", bytes));
  const hash = Array.from(digest, function (b) { return b.toString(16).padStart(2, "0"); }).join("");
  document.cookie = "stocklock_access=" + hash + "; Max-Age=2592000; Path=/; Secure; SameSite=Lax";
  location.reload();
});
</script>
</body>
</html>
