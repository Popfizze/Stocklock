# Builds the API image, pushes it to ECR and points the Lambda function at it.
name: deploy-backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "alphaforge_starter/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: backend
          build-contexts: data=alphaforge_starter
          platforms: linux/amd64
          # Lambda rejects multi-manifest images (attestations).
          provenance: false
          sbom: false
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update the Lambda function
        env:
          IMAGE_URI: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          set -euo pipefail
          if ! aws lambda get-function --function-name "$FUNCTION_NAME" >/dev/null 2>&1; then
            echo "::notice::Function $FUNCTION_NAME does not exist yet: the deploy-infra workflow creates it."
            exit 0
          fi
          aws lambda wait function-updated-v2 --function-name "$FUNCTION_NAME"
          aws lambda update-function-code --function-name "$FUNCTION_NAME" --image-uri "$IMAGE_URI" \
            --query '{image: CodeSha256, state: LastUpdateStatus}'
          aws lambda wait function-updated-v2 --function-name "$FUNCTION_NAME"
          echo "Deployed $IMAGE_URI" >> "$GITHUB_STEP_SUMMARY"
